services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: drawing_game
      MYSQL_USER: game_user
      MYSQL_PASSWORD: game_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://game_user:game_password@mysql:3306/drawing_game
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  mysql_data:
